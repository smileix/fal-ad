train:
  batch_size: 64
  num_epochs: 80
  learning_rate: 0.00005
  weight_decay: 0.01
  early_stopping: True
  early_stopping_patience: 20
  cross_validation: False
  local_training: True
  cross_validation_folds: 0
  learning_paradigm: 'fl'
  cvd: 5
  strategy: 'fedavg'
  augment: False

model:
  pooling: 'attn'
  n_layers: 1
  dropout: 0.3
  hidden_size: 768
  intermediate_size: 3072
  n_heads: 12
  num_classes: 1
  hidden_mlp_size: 256
  textual_model: 'distil'
  audio_model: 'wav2vec2'
  pauses: True
  fusion: 'gated_cross_attention'
  single_modal: ''

model_name: ''
